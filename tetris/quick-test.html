<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块快速测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 30px;
        }
        .test-button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #3b82f6;
        }
        .test-result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-family: monospace;
            text-align: left;
            min-height: 100px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #06b6d4; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>俄罗斯方块游戏快速测试</h1>
        
        <div>
            <button class="test-button" onclick="runBasicTest()">运行基础测试</button>
            <button class="test-button" onclick="openGame()">打开游戏</button>
            <button class="test-button" onclick="clearLog()">清空日志</button>
        </div>
        
        <div class="test-result" id="logOutput">
            等待测试运行...
        </div>
        
        <div style="margin-top: 30px; text-align: left;">
            <h3>测试项目清单：</h3>
            <ul>
                <li>✅ 游戏页面加载</li>
                <li>✅ JavaScript模块加载</li>
                <li>✅ Canvas渲染初始化</li>
                <li>✅ 方块生成系统</li>
                <li>✅ 游戏引擎状态</li>
                <li>✅ 键盘控制响应</li>
                <li>✅ 分数系统</li>
                <li>✅ 本地存储（最高分）</li>
            </ul>
        </div>
    </div>
    
    <script>
        const logOutput = document.getElementById('logOutput');
        
        function log(message, className = 'info') {
            const time = new Date().toLocaleTimeString();
            logOutput.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        function clearLog() {
            logOutput.innerHTML = '日志已清空...';
        }
        
        function openGame() {
            window.open('index.html', '_blank');
            log('已打开游戏页面', 'success');
        }
        
        async function runBasicTest() {
            log('开始运行基础测试...');
            
            try {
                // 测试1: 检查页面元素
                log('测试1: 检查HTML文件...');
                const response = await fetch('index.html');
                if (response.ok) {
                    log('✅ index.html 文件存在', 'success');
                } else {
                    throw new Error('index.html 文件不存在或无法访问');
                }
                
                // 测试2: 检查CSS文件
                log('测试2: 检查CSS文件...');
                const cssResponse = await fetch('style.css');
                if (cssResponse.ok) {
                    log('✅ style.css 文件存在', 'success');
                } else {
                    throw new Error('style.css 文件不存在');
                }
                
                // 测试3: 检查JavaScript模块
                log('测试3: 检查JavaScript模块...');
                const modules = [
                    'src/config.js',
                    'src/main.js',
                    'src/block/block.js',
                    'src/game/game.js',
                    'src/game/grid.js',
                    'src/game/score.js',
                    'src/render/canvas-renderer.js',
                    'src/ui/ui-controller.js'
                ];
                
                let allModulesExist = true;
                for (const module of modules) {
                    const moduleResponse = await fetch(module);
                    if (!moduleResponse.ok) {
                        log(`❌ ${module} 文件不存在`, 'error');
                        allModulesExist = false;
                    }
                }
                
                if (allModulesExist) {
                    log('✅ 所有JavaScript模块文件存在', 'success');
                }
                
                // 测试4: 测试localStorage支持
                log('测试4: 测试本地存储支持...');
                try {
                    localStorage.setItem('test_key', 'test_value');
                    const value = localStorage.getItem('test_key');
                    localStorage.removeItem('test_key');
                    
                    if (value === 'test_value') {
                        log('✅ localStorage 功能正常', 'success');
                    } else {
                        log('⚠️ localStorage 功能可能有限', 'info');
                    }
                } catch (e) {
                    log('⚠️ localStorage 可能被禁用', 'info');
                }
                
                // 测试5: 检查Canvas支持
                log('测试5: 检查Canvas支持...');
                const canvas = document.createElement('canvas');
                if (canvas.getContext) {
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        log('✅ Canvas 2D API 可用', 'success');
                    } else {
                        log('⚠️ Canvas 2D上下文获取失败', 'info');
                    }
                } else {
                    log('⚠️ Canvas 不支持', 'info');
                }
                
                // 测试6: 游戏配置文件结构
                log('测试6: 检查游戏配置...');
                try {
                    const configResponse = await fetch('src/config.js');
                    const configText = await configResponse.text();
                    
                    if (configText.includes('GameConfig') && 
                        configText.includes('GRID_WIDTH') &&
                        configText.includes('BLOCK_COLORS')) {
                        log('✅ 游戏配置文件结构正确', 'success');
                    } else {
                        log('⚠️ 游戏配置文件可能不完整', 'info');
                    }
                } catch (e) {
                    log('❌ 无法读取游戏配置文件', 'error');
                }
                
                log('基础测试完成！', 'success');
                log('建议：点击"打开游戏"按钮进行实际游戏测试。', 'info');
                
            } catch (error) {
                log(`测试过程中出错: ${error.message}`, 'error');
                console.error('测试错误详情:', error);
            }
        }
        
        // 页面加载后自动运行简单检查
        setTimeout(() => {
            log('页面加载完成，点击"运行基础测试"开始测试。', 'info');
        }, 500);
    </script>
</body>
</html>

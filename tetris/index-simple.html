<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块 - 简单版本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .game-container {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #3b82f6;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 900px;
        }
        
        h1 {
            text-align: center;
            color: #3b82f6;
            margin-bottom: 20px;
            font-size: 36px;
        }
        
        .game-area {
            display: flex;
            gap: 30px;
            margin: 30px 0;
        }
        
        #gameCanvas {
            border: 4px solid #3b82f6;
            background: #1e293b;
            border-radius: 10px;
        }
        
        .side-panel {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        
        .status {
            margin: 20px 0;
            text-align: center;
            font-size: 20px;
            color: #06b6d4;
        }
        
        .instructions {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>俄罗斯方块</h1>
        
        <div class="game-area">
            <div>
                <canvas id="gameCanvas" width="400" height="800"></canvas>
            </div>
            
            <div class="side-panel">
                <div class="status">
                    <span id="gameState">准备开始</span>
                </div>
                
                <div class="info">
                    <div class="info-item">
                        <span>分数:</span>
                        <span id="score">000000</span>
                    </div>
                    <div class="info-item">
                        <span>最高分:</span>
                        <span id="highScore">000000</span>
                    </div>
                    <div class="info-item">
                        <span>等级:</span>
                        <span id="level">01</span>
                    </div>
                    <div class="info-item">
                        <span>消行:</span>
                        <span id="lines">000</span>
                    </div>
                    <div class="info-item">
                        <span>下一个:</span>
                        <span id="nextBlock">等待中...</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="startButton">开始游戏</button>
                    <button id="pauseButton">暂停</button>
                    <button id="restartButton">重新开始</button>
                </div>
                
                <div class="instructions">
                    <p><strong>操作说明:</strong></p>
                    <p>← → : 左右移动</p>
                    <p>↑ : 旋转方块</p>
                    <p>↓ : 加速下落</p>
                    <p>空格 : 立即下落</p>
                    <p>P : 暂停/继续</p>
                    <p>R : 重新开始</p>
                    <p>Enter : 开始游戏</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="simple-main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>测试方块放置</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #output { background: #f0f0f0; padding: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>俄罗斯方块方块放置测试</h1>
    <div id="output"></div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '<br>';
        }
        
        async function test() {
            try {
                // 导入模块
                const config = await import('./src/config.js');
                const blockModule = await import('./src/block/block.js');
                const gridModule = await import('./src/game/grid.js');
                
                log('✅ 模块加载成功');
                
                // 测试所有方块类型
                const blockTypes = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
                const grid = new gridModule.GameGrid();
                
                log(`网格尺寸: ${grid.width}x${grid.height}`);
                
                for (const type of blockTypes) {
                    const block = new blockModule.Block(type);
                    log(`\n方块类型: ${type}`);
                    log(`  位置: (${block.x}, ${block.y})`);
                    log(`  默认x计算: Math.floor(${config.GameConfig.GRID_WIDTH}/2)-2 = ${Math.floor(config.GameConfig.GRID_WIDTH / 2) - 2}`);
                    
                    const cells = block.getCells();
                    log(`  单元格数: ${cells.length}`);
                    log(`  单元格位置: ${cells.map(c => `(${c.row},${c.col})`).join(', ')}`);
                    
                    const canPlace = grid.canPlaceBlock(block);
                    log(`  能否放置: ${canPlace}`);
                    
                    if (!canPlace) {
                        // 检查为什么不能放置
                        for (const cell of cells) {
                            const isEmpty = grid.isEmpty(cell.row, cell.col);
                            const inBounds = cell.row >= 0 && cell.row < grid.height && 
                                           cell.col >= 0 && cell.col < grid.width;
                            log(`    单元格(${cell.row},${cell.col}): 在边界内=${inBounds}, 是否为空=${isEmpty}`);
                        }
                    }
                }
                
                // 测试方块工厂
                log('\n--- 测试方块工厂 ---');
                const factory = new blockModule.BlockFactory();
                const testBlock = factory.createNextBlock();
                log(`工厂创建方块: ${testBlock.type} (${testBlock.x}, ${testBlock.y})`);
                
                // 测试游戏引擎
                log('\n--- 测试游戏引擎 ---');
                const gameModule = await import('./src/game/game.js');
                const engine = new gameModule.GameEngine();
                
                const initialState = engine.getGameState();
                log(`初始状态: ${initialState.state}`);
                log(`当前方块: ${initialState.currentBlock ? '存在' : '不存在'}`);
                log(`下一个方块: ${initialState.nextBlock ? '存在(' + initialState.nextBlock.type + ')' : '不存在'}`);
                
                if (initialState.nextBlock) {
                    const canPlace = grid.canPlaceBlock(initialState.nextBlock);
                    log(`下一个方块能否放置: ${canPlace}`);
                }
                
                // 测试启动游戏
                log('\n--- 测试游戏启动 ---');
                engine.start();
                
                const stateAfterStart = engine.getGameState();
                log(`启动后状态: ${stateAfterStart.state}`);
                log(`启动后当前方块: ${stateAfterStart.currentBlock ? '存在(' + stateAfterStart.currentBlock.type + ')' : '不存在'}`);
                
                if (stateAfterStart.currentBlock) {
                    const canPlace = grid.canPlaceBlock(stateAfterStart.currentBlock);
                    log(`当前方块能否放置: ${canPlace}`);
                    
                    // 尝试移动
                    const moved = engine.moveCurrentBlock(0, 1);
                    log(`能否向下移动: ${moved}`);
                }
                
            } catch (error) {
                log(`❌ 错误: ${error.message}`);
                console.error(error);
            }
        }
        
        test();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块调试修复版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #3b82f6;
            margin-bottom: 20px;
        }
        
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #3b82f6;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        #gameCanvas {
            border: 4px solid #3b82f6;
            background: #1e293b;
            margin: 20px 0;
            border-radius: 10px;
        }
        
        .info {
            text-align: left;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        .log {
            font-family: monospace;
            background: black;
            color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>俄罗斯方块调试修复版</h1>
        <p>直接加载，不使用ES模块</p>
        
        <canvas id="gameCanvas" width="400" height="800"></canvas>
        
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="pauseGame()">暂停/继续</button>
            <button onclick="resetGame()">重新开始</button>
            <button onclick="moveLeft()">← 左移</button>
            <button onclick="moveRight()">→ 右移</button>
            <button onclick="rotateBlock()">↑ 旋转</button>
            <button onclick="dropBlock()">↓ 下落</button>
        </div>
        
        <div class="info">
            <h3>游戏状态:</h3>
            <p>状态: <span id="gameState">准备开始</span></p>
            <p>分数: <span id="score">0</span></p>
            <p>等级: <span id="level">1</span></p>
            <p>消行: <span id="lines">0</span></p>
            <p>下一个方块: <span id="nextBlock">等待中...</span></p>
        </div>
        
        <div class="info">
            <h3>控制说明:</h3>
            <p>← → : 左右移动方块</p>
            <p>↑ : 旋转方块</p>
            <p>↓ : 加速下落</p>
            <p>空格 : 立即下落</p>
            <p>P : 暂停/继续</p>
            <p>R : 重新开始</p>
            <p>Enter : 开始游戏</p>
        </div>
        
        <div id="log" class="log">等待加载...</div>
    </div>
    
    <script>
        // 游戏全局变量
        let gameEngine = null;
        let renderer = null;
        let gameInitialized = false;
        
        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            logDiv.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // 更新UI显示
        function updateUI() {
            if (!gameEngine) return;
            
            const state = gameEngine.getGameState();
            document.getElementById('gameState').textContent = getStateText(state.state);
            document.getElementById('score').textContent = state.score;
            document.getElementById('level').textContent = state.level;
            document.getElementById('lines').textContent = state.linesCleared;
            
            if (state.nextBlock) {
                document.getElementById('nextBlock').textContent = state.nextBlock.type;
            }
            
            // 渲染游戏
            if (renderer) {
                renderer.render(state);
            }
        }
        
        function getStateText(state) {
            switch(state) {
                case 'initial': return '准备开始';
                case 'playing': return '进行中';
                case 'paused': return '已暂停';
                case 'game_over': return '游戏结束';
                default: return state;
            }
        }
        
        // 初始化游戏
        async function initializeGame() {
            log('开始初始化游戏...', 'info');
            
            try {
                // 动态加载所有模块
                log('加载游戏模块...', 'info');
                
                // 加载config.js
                log('加载 config.js...', 'info');
                const configModule = await import('./src/config.js');
                window.GameConfig = configModule.GameConfig;
                window.GameState = configModule.GameState;
                log('✅ config.js 加载成功', 'success');
                
                // 加载block.js
                log('加载 block/block.js...', 'info');
                const blockModule = await import('./src/block/block.js');
                window.Block = blockModule.Block;
                window.BlockFactory = blockModule.BlockFactory;
                log('✅ block.js 加载成功', 'success');
                
                // 加载game.js
                log('加载 game/game.js...', 'info');
                const gameModule = await import('./src/game/game.js');
                window.GameEngine = gameModule.GameEngine;
                log('✅ game.js 加载成功', 'success');
                
                // 加载renderer.js
                log('加载 render/canvas-renderer.js...', 'info');
                const renderModule = await import('./src/render/canvas-renderer.js');
                window.CanvasRenderer = renderModule.CanvasRenderer;
                log('✅ canvas-renderer.js 加载成功', 'success');
                
                // 创建游戏实例
                log('创建游戏引擎...', 'info');
                gameEngine = new GameEngine();
                
                // 创建渲染器
                const canvas = document.getElementById('gameCanvas');
                renderer = new CanvasRenderer(canvas);
                
                // 设置回调
                gameEngine.setOnStateChange((state) => {
                    log(`游戏状态改变: ${state}`, 'info');
                    updateUI();
                });
                
                gameEngine.setOnScoreUpdate((score, highScore) => {
                    log(`分数更新: ${score}`, 'info');
                    updateUI();
                });
                
                // 初始渲染
                updateUI();
                
                gameInitialized = true;
                log('🎉 游戏初始化完成！', 'success');
                log('点击"开始游戏"按钮开始游戏。', 'info');
                
            } catch (error) {
                log(`❌ 初始化失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
                
                // 尝试备用方案 - 使用简单的游戏实现
                log('尝试使用简化版本...', 'warning');
                loadSimpleVersion();
            }
        }
        
        // 备用简化版本
        function loadSimpleVersion() {
            log('加载简化版俄罗斯方块...', 'warning');
            
            // 创建最简单的游戏逻辑
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 简单游戏状态
            const simpleGame = {
                state: 'initial',
                score: 0,
                level: 1,
                lines: 0
            };
            
            // 绘制网格
            function drawGrid() {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 网格线
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 1;
                
                const cellSize = 40;
                for (let x = 0; x <= canvas.width; x += cellSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y <= canvas.height; y += cellSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 显示游戏状态
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('游戏加载成功！', canvas.width/2, canvas.height/2 - 30);
                ctx.fillText('点击开始游戏按钮', canvas.width/2, canvas.height/2);
            }
            
            // 更新UI
            function updateSimpleUI() {
                document.getElementById('gameState').textContent = getStateText(simpleGame.state);
                document.getElementById('score').textContent = simpleGame.score;
                document.getElementById('level').textContent = simpleGame.level;
                document.getElementById('lines').textContent = simpleGame.lines;
                
                drawGrid();
            }
            
            // 游戏控制函数
            window.startGame = function() {
                simpleGame.state = 'playing';
                log('游戏开始！', 'success');
                updateSimpleUI();
            };
            
            window.pauseGame = function() {
                simpleGame.state = simpleGame.state === 'playing' ? 'paused' : 'playing';
                log(`游戏${simpleGame.state === 'paused' ? '暂停' : '继续'}`, 'info');
                updateSimpleUI();
            };
            
            window.resetGame = function() {
                simpleGame.state = 'initial';
                simpleGame.score = 0;
                simpleGame.level = 1;
                simpleGame.lines = 0;
                log('游戏重置', 'info');
                updateSimpleUI();
            };
            
            window.moveLeft = function() { log('向左移动', 'info'); };
            window.moveRight = function() { log('向右移动', 'info'); };
            window.rotateBlock = function() { log('旋转方块', 'info'); };
            window.dropBlock = function() { log('加速下落', 'info'); };
            
            updateSimpleUI();
            log('✅ 简化版游戏加载完成', 'success');
        }
        
        // 游戏控制函数
        window.startGame = function() {
            if (!gameInitialized) {
                log('游戏未初始化，请等待...', 'warning');
                return;
            }
            
            log('开始游戏...', 'info');
            gameEngine.start();
            updateUI();
        };
        
        window.pauseGame = function() {
            if (!gameEngine) return;
            gameEngine.togglePause();
            updateUI();
        };
        
        window.resetGame = function() {
            if (!gameEngine) return;
            gameEngine.reset();
            updateUI();
        };
        
        window.moveLeft = function() {
            if (!gameEngine) return;
            gameEngine.moveCurrentBlock(-1, 0);
            updateUI();
        };
        
        window.moveRight = function() {
            if (!gameEngine) return;
            gameEngine.moveCurrentBlock(1, 0);
            updateUI();
        };
        
        window.rotateBlock = function() {
            if (!gameEngine) return;
            gameEngine.rotateCurrentBlock(1);
            updateUI();
        };
        
        window.dropBlock = function() {
            if (!gameEngine) return;
            gameEngine.softDrop();
            updateUI();
        };
        
        // 键盘控制
        document.addEventListener('keydown', (event) => {
            if (!gameEngine) return;
            
            switch(event.key) {
                case 'ArrowLeft':
                    gameEngine.moveCurrentBlock(-1, 0);
                    updateUI();
                    break;
                case 'ArrowRight':
                    gameEngine.moveCurrentBlock(1, 0);
                    updateUI();
                    break;
                case 'ArrowUp':
                    gameEngine.rotateCurrentBlock(1);
                    updateUI();
                    break;
                case 'ArrowDown':
                    gameEngine.softDrop();
                    updateUI();
                    break;
                case ' ':
                    event.preventDefault();
                    gameEngine.hardDrop();
                    updateUI();
                    break;
                case 'p':
                case 'P':
                    gameEngine.togglePause();
                    updateUI();
                    break;
                case 'r':
                case 'R':
                    gameEngine.reset();
                    gameEngine.start();
                    updateUI();
                    break;
                case 'Enter':
                    if (gameEngine.state === 'initial' || gameEngine.state === 'game_over') {
                        gameEngine.start();
                        updateUI();
                    }
                    break;
            }
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            log('页面加载完成', 'success');
            log('开始初始化游戏...', 'info');
            initializeGame();
        });
    </script>
</body>
</html>

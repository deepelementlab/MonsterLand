<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas Check</title>
    <style>
        body { margin: 0; background: #111; color: #eee; font-family: monospace; }
        #info { padding: 10px; font-size: 14px; white-space: pre-wrap; }
        #game-container { width: 100vw; height: 50vh; background: #87CEEB; position: relative; }
    </style>
</head>
<body>
<div id="info">Loading game...</div>
<div id="game-container"></div>
<script type="module">
    import Phaser from 'phaser';
    import { SCENE_KEYS, COLORS } from './src/utils/constants.js';
    import { GameConfig } from './src/config/game.config.js';
    import { BootScene } from './src/scenes/BootScene.js';
    import { PreloadScene } from './src/scenes/PreloadScene.js';
    import { MenuScene } from './src/scenes/MenuScene.js';
    import { GameScene } from './src/scenes/GameScene.js';

    const info = document.getElementById('info');
    
    const config = {
        type: Phaser.AUTO,
        width: GameConfig.width,
        height: GameConfig.height,
        parent: 'game-container',
        backgroundColor: '#87CEEB',
        physics: {
            default: 'matter',
            matter: { gravity: GameConfig.physics.gravity, debug: GameConfig.physics.debug }
        },
        scene: [BootScene, PreloadScene, MenuScene, GameScene],
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        }
    };

    const game = new Phaser.Game(config);
    window.game = game;

    // Wait for game to be ready, then check canvas
    game.events.on('ready', () => {
        setTimeout(() => {
            const canvas = document.querySelector('#game-container canvas');
            if (!canvas) {
                info.textContent += '\nERROR: No canvas found!';
                return;
            }
            const rect = canvas.getBoundingClientRect();
            info.textContent = `Canvas found!
  - size: ${canvas.width}x${canvas.height}
  - display: ${rect.width}x${rect.height}
  - position: (${rect.left}, ${rect.top})
  - style: ${canvas.style.cssText}
  - Game scenes: ${game.scene.getScenes(true).length} active
  - Active scene: ${game.scene.isActive(SCENE_KEYS.MENU) ? 'MENU' : game.scene.isActive(SCENE_KEYS.BOOT) ? 'BOOT' : 'PRELOAD'}
  
  Checking pixels...`;
            
            // Check if canvas has non-blue pixels
            try {
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    let nonBluePixels = 0;
                    let whitePixels = 0;
                    let redPixels = 0;
                    const total = canvas.width * canvas.height;
                    for (let i = 0; i < data.length; i += 16) { // sample every 4th pixel
                        const r = data[i], g = data[i+1], b = data[i+2];
                        if (r > 200 && g > 200 && b > 200) whitePixels++;
                        if (r > 200 && g < 100 && b < 100) redPixels++;
                        if (Math.abs(r-0x87) > 20 || Math.abs(g-0xCE) > 20 || Math.abs(b-0xEB) > 20) nonBluePixels++;
                    }
                    const samples = Math.floor(data.length / 16);
                    info.textContent += `
  Pixel analysis (sampled ${samples} pixels):
    - Non-blue pixels: ${nonBluePixels} (${(nonBluePixels/samples*100).toFixed(1)}%)
    - White pixels: ${whitePixels} (${(whitePixels/samples*100).toFixed(1)}%)  
    - Red pixels: ${redPixels} (${(redPixels/samples*100).toFixed(1)}%)
    
    ${nonBluePixels > 0 ? 'GAME IS RENDERING CONTENT!' : 'ONLY BLUE - game might not be rendering'}`;
                } else {
                    info.textContent += '\n  Cannot get 2D context (WebGL canvas - this is normal)';
                }
            } catch(e) {
                info.textContent += '\n  Canvas pixel check error: ' + e.message;
            }
        }, 2000);
    });
</script>
</body>
</html>

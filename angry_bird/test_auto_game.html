<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Auto Game Test v2</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:monospace}
#log{padding:10px;font-size:12px;line-height:1.4;max-height:300px;overflow-y:auto}
.err{color:#ff5a5f}.ok{color:#00a699}.warn{color:#ffb400}
#game-container{width:100%;height:calc(100vh-300px);display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<div id="log"></div>
<div id="game-container"></div>
<script>
var logEl=document.getElementById('log');
function addLog(m,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight}
window.onerror=function(m,u,l){addLog('ERR:'+m+' L'+l,'err')};
</script>
<script type="module">
import Phaser from 'phaser';
import{GameConfig}from'./src/config/game.config.js';
import{SCENE_KEYS,COLORS,SIZES,VISUAL}from'./src/utils/constants.js';

addLog('Direct GameScene test (skip menu)','ok');

class SkipBoot extends Phaser.Scene{constructor(){super('BootScene')}create(){this.scene.start('PreloadScene')}}
class SkipPreload extends Phaser.Scene{constructor(){super('PreloadScene')}preload(){}create(){this.scene.start('GameScene',{level:1})}}

// Import real GameScene
var GameSceneModule=await import('./src/scenes/GameScene.js');
var GameScene=GameSceneModule.GameScene;

var origCreate=GameScene.prototype.create;
GameScene.prototype.create=function(){
  addLog('GS.create START','ok');
  try{
    origCreate.call(this);
    addLog('GS.create DONE','ok');
    var em=this.entityManager;
    var bird=em.getCurrentBird();
    if(bird&&bird.body){
      var m=bird.body.mass;
      addLog('  bird.mass='+m+' isFinite='+isFinite(m)+' isStatic='+bird.body.isStatic,'ok');
      if(bird.body.plugin&&bird.body.plugin.originalMass){
        addLog('  plugin.originalMass='+bird.body.plugin.originalMass,'ok');
      }
    }
    // Patch inputSystem for debug
    var self=this;
    var is=this.inputSystem;
    var origDown=is.handlePointerDown;
    is.handlePointerDown=function(ptr){
      addLog('ptrDown '+ptr.x.toFixed(0)+','+ptr.y.toFixed(0),'warn');
      origDown.call(is,ptr);
      addLog('  isDragging='+is.isDragging,'warn');
    };
    var origShow=is.showTrajectory;
    is.showTrajectory=function(dx,dy){
      addLog('showTraj dx='+dx.toFixed(1)+' dy='+dy.toFixed(1),'ok');
      origShow.call(is,dx,dy);
      addLog('  dots='+is.trajectoryPoints.length,'ok');
    };
    // Auto drag test in 2s
    setTimeout(function(){
      addLog('=== AUTO DRAG TEST ===','warn');
      var lp=em.slingshot.launchPoint;
      addLog('lp='+JSON.stringify(lp),'ok');
      // Simulate Phaser input events directly through the scene
      self.input.emit('pointerdown',{x:lp.x,y:lp.y});
      setTimeout(function(){
        addLog('  moving pointer...','warn');
        self.input.emit('pointermove',{x:lp.x-80,y:lp.y+50});
        setTimeout(function(){
          addLog('  isDragging='+is.isDragging+' dots='+is.trajectoryPoints.length,'warn');
          self.input.emit('pointerup',{});
          addLog('  released','ok');
        },300);
      },200);
    },2000);
  }catch(e){addLog('GS ERR:'+e.message,'err');addLog(e.stack,'err')}
};

var config={
  type:Phaser.AUTO,width:GameConfig.width,height:GameConfig.height,
  parent:'game-container',backgroundColor:'#87CEEB',
  physics:{default:'matter',matter:{gravity:GameConfig.physics.gravity,debug:false}},
  scene:[SkipBoot,SkipPreload,GameScene],
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}
};
window.game=new Phaser.Game(config);
addLog('Game created','ok');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Angry Birds - Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #87CEEB; overflow: hidden; touch-action: none; }
        #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        canvas { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        // Error capture before module loads
        window.__debugLog = [];
        const origErr = console.error;
        console.error = function() {
            window.__debugLog.push('ERROR: ' + Array.from(arguments).join(' '));
            origErr.apply(console, arguments);
        };
        window.onerror = function(msg, url, line) {
            window.__debugLog.push('UNCAUGHT: ' + msg + ' L' + line);
        };
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>

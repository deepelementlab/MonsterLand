<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Angry Birds Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #87CEEB; overflow: hidden; touch-action: none; }
        #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        canvas { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module">
        import Phaser from 'phaser';
        import { GameConfig } from './src/config/game.config.js';
        import { SCENE_KEYS } from './src/utils/constants.js';
        import { BootScene } from './src/scenes/BootScene.js';
        import { PreloadScene } from './src/scenes/PreloadScene.js';
        import { MenuScene } from './src/scenes/MenuScene.js';
        import { GameScene } from './src/scenes/GameScene.js';

        const config = {
            type: Phaser.AUTO,
            width: GameConfig.width,
            height: GameConfig.height,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'matter',
                matter: { gravity: GameConfig.physics.gravity, debug: false }
            },
            scene: [BootScene, PreloadScene, MenuScene, GameScene],
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };

        const game = new Phaser.Game(config);
        window.game = game;
    </script>
</body>
</html>
